name: Release on version bump

# Creates a GitHub Release (with a ready-to-install plugin archive) for the
# current PLUGIN_BITWARDENSEND_VERSION in setup.php. Idempotent: if a release
# for that version already exists (e.g. setup.php was touched without
# bumping the version), the job skips silently.
#
# Manual only (workflow_dispatch) — e.g. `gh workflow run release.yml --ref
# main` or "Run workflow" in the Actions UI. Run "Rebuild translation
# catalogs" (locales.yml) first if the branch's catalogs might be stale: this
# workflow does not check or wait for that on its own.
#
# Version strings containing a hyphen (e.g. 1.0.0-beta1) are published as a
# GitHub pre-release automatically.
#
# Tags have no "v" prefix, matching the GLPI marketplace convention (see
# pluginsGLPI plugins' own releases). Existing v1.0.0-beta1/beta2/beta3 tags
# predate this and are left as they are — only tags from here on are bare.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          version=$(grep -oP "PLUGIN_BITWARDENSEND_VERSION',\s*'\K[^']+" setup.php)
          if [ -z "$version" ]; then
            echo "Could not extract PLUGIN_BITWARDENSEND_VERSION from setup.php" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin archive
        if: steps.check_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GLPI marketplace naming convention: glpi-<plugin key>-<version>.tar.bz2
          git archive --format=tar --prefix=bitwardensend/ HEAD \
            | bzip2 -9 > "glpi-bitwardensend-$VERSION.tar.bz2"

      - name: Create GitHub release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease_flag=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$VERSION" \
            "glpi-bitwardensend-$VERSION.tar.bz2" \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease_flag[@]}"
