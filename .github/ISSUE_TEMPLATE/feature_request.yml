name: Feature request
description: Suggest an idea or an improvement for this plugin.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search
        [existing issues](https://github.com/IT-Gouvernance/bitwardensend/issues)
        first — it may already be requested.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the plugin doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you expect this to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you're using today, or other approaches you thought of.
    validations:
      required: false
